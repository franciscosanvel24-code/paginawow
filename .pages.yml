media:
  input: assets/blog
  output: /paginawow/assets/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: articles
    label: Artículos de WOW Ideas
    type: collection
    path: content/posts
    format: json
    filename:
      template: "{slug}.json"
      field: create
    exclude: [".gitkeep"]
    view:
      fields: [title, category, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: URL del artículo
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Usa únicamente minúsculas, números y guiones."
      - name: category
        label: Categoría
        type: string
        required: true
      - name: cover
        label: Imagen de portada
        type: image
        required: true
      - name: author
        label: Autor
        type: string
        required: true
      - name: date
        label: Fecha de publicación
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: excerpt
        label: Extracto
        type: text
        required: true
      - name: content
        label: Contenido
        type: rich-text
        required: true
        options:
          format: html
          path: assets/blog
          rename: safe
      - name: seo_title
        label: Metatítulo SEO
        type: string
        required: true
      - name: seo_description
        label: Metadescripción
        type: text
        required: true
      - name: published
        label: Publicado
        type: boolean
        required: true
        default: false

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content(blog): crear {filename}"
      update: "content(blog): actualizar {filename}"
      delete: "content(blog): eliminar {filename}"
